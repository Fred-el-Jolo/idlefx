[tools]
rust = "1.99.0"

# Tasks that drive the terminal (raw mode, keys) need `raw = true`: otherwise
# mise runs them outside the terminal's foreground group and they freeze on
# their first read.

[tasks.plasma]
description = "Run the plasma example (q quits, space pauses, f shows fps)"
run = "cargo run --release --example plasma --"
raw = true

[tasks.dog]
description = "Run the dog companion in this terminal (q quits)"
run = "cargo run --release -p idlefx-companion --"
raw = true

[tasks.check]
description = "Clippy with warnings as errors, then all tests"
run = [
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
]

[tasks.install]
description = "Install idlefx-companion into ~/.cargo/bin (needed by launch and the hooks)"
run = "cargo install --path crates/companion"

[tasks.launch]
description = "Install, then open the dog in its own floating window"
depends = ["install"]
run = "idlefx-companion launch"

[tasks.stop]
description = "Close the dog's floating window"
run = "systemctl --user stop idlefx-companion 2>/dev/null || echo 'idlefx-companion is not running'"

[tasks.poses]
description = "Print every pose of the dog inline"
run = """
cargo build --release -q -p idlefx-companion
for pose in stand walk sit lie sleep happy sad curious; do
  echo "$pose"
  ./target/release/idlefx-companion snapshot --pose "$pose"
done
"""

[tasks.poke]
description = "Send an event to the running dog: hello, thinking, success, failure, commit"
run = "cargo run --release -q -p idlefx-companion -- poke"

[tasks.stats]
description = "CPU and memory of the running dog every 2 s (and of its launched unit, terminal included)"
shell = "bash -c"
run = """
pid=$(pgrep -n -x idlefx-companio) || { echo 'idlefx-companion is not running'; exit 0; }
hz=$(getconf CLK_TCK)
cg=$(systemctl --user show -p ControlGroup --value idlefx-companion 2>/dev/null)
[ -n "$cg" ] && [ -r "/sys/fs/cgroup$cg/cpu.stat" ] && cg="/sys/fs/cgroup$cg" || cg=
ticks() { awk '{print $14 + $15}' "/proc/$pid/stat" 2>/dev/null; }
usec() { awk '/^usage_usec/ {print $2}' "$cg/cpu.stat"; }
echo "dog pid $pid${cg:+, unit idlefx-companion} (Ctrl-C to stop)"
p0=$(ticks); [ -n "$cg" ] && u0=$(usec)
while sleep 2; do
  p1=$(ticks) || break
  [ -n "$p1" ] || { echo 'idlefx-companion exited'; break; }
  rss=$(awk '/^VmRSS/ {print $2}' "/proc/$pid/status")
  line=$(awk -v a="$p0" -v b="$p1" -v hz="$hz" -v rss="$rss" \
    'BEGIN {printf "dog  cpu %5.2f%%  rss %5.1f MB", (b - a) / hz / 2 * 100, rss / 1024}')
  if [ -n "$cg" ]; then
    u1=$(usec); mem=$(cat "$cg/memory.current"); max=$(cat "$cg/memory.max")
    line+=$(awk -v a="$u0" -v b="$u1" -v m="$mem" -v x="$max" \
      'BEGIN {printf "   |   unit  cpu %5.2f%% of 10%%  mem %5.1f MB of %s", (b - a) / 2e6 * 100, m / 1048576, x == "max" ? "max" : x / 1048576}')
    u0=$u1
  fi
  echo "$(date +%T)  $line"
  p0=$p1
done
"""

[tasks.bench]
description = "Frame rate and CPU: 300 plasma frames, then 10 s of the walking dog"
raw = true
run = [
  "cargo run --release -q --example plasma -- --frames 300",
  "cargo run --release -q -p idlefx-companion -- --state walk --duration 10 --stats",
]
