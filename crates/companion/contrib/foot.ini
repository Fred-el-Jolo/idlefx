# foot config for the idlefx companion window: the default background is
# fully transparent (the dog's pixels stay opaque), no decorations, no padding.
# `idlefx-companion launch` writes this file to $XDG_RUNTIME_DIR and passes it
# with --config.

[main]
pad=0x0

[colors]
alpha=0.0

[csd]
preferred=none
