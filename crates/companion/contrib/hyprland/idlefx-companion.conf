# Hyprland rules for the idlefx companion window (Hyprland 0.53+ syntax).
# Add to hyprland.conf:  source = /path/to/idlefx/crates/companion/contrib/hyprland/idlefx-companion.conf
#
# Floating, on every workspace, no border, shadow, blur or rounding, not
# focused when it opens, at the bottom-right corner of the monitor.

windowrule {
  name = idlefx-companion
  match:class = ^(idlefx-companion)$

  float = on
  pin = on
  border_size = 0
  rounding = 0
  no_shadow = on
  no_blur = on
  no_initial_focus = on
  move = (monitor_w-window_w-16) (monitor_h-window_h-16)
}
