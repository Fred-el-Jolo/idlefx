# idlefx-companion: the dog sleeps while you are away and greets you when you
# are back. Sourced from hypridle.conf (`idlefx-companion hooks install hypridle`).
listener {
    timeout = 300
    on-timeout = idlefx-companion poke sleep 2>/dev/null || true
    on-resume = idlefx-companion poke wake 2>/dev/null || true
}
