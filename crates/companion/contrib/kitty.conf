# kitty config for the idlefx companion window: the default background is
# fully transparent (the dog's pixels stay opaque), no decorations, no padding.
# `idlefx-companion launch` writes this file to $XDG_RUNTIME_DIR and passes it
# with --config, so the user's own kitty.conf is not read.

background_opacity 0
window_padding_width 0
hide_window_decorations yes
remember_window_size no
confirm_os_window_close 0
